<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rítmica Visual - Reconocimiento Auditivo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Encabezado -->
        <header>
            <h1>Rítmica Visual</h1>
            <div id="stage-info">
                <span id="stage-title">Cargando etapa...</span>
                <div id="progress-bar-container">
                    <div id="progress-bar"></div>
                </div>
            </div>
        </header>

        <!-- Contenedor Principal de Contenidos / Tutoriales o Ejercicios -->
        <main id="main-content">
            <!-- Vista dinámica generada por JavaScript según la Etapa -->
        </main>

        <!-- Panel de Control de Audio y Reproducción -->
        <section id="audio-control-panel" class="hidden">
            <div class="tempo-control">
                <label for="bpm-slider">Tempo: <span id="bpm-val">80</span> BPM</label>
                <input type="range" id="bpm-slider" min="60" max="120" value="80">
            </div>
            <div class="action-buttons">
                <button id="btn-play-count" class="btn primary">🔊 Escuchar Cuenta Previa y Patrón</button>
                <button id="btn-replay" class="btn secondary" disabled>🔁 Repetir Patrón</button>
            </div>
            <div id="count-visualizer" class="count-display hidden">
                <span class="count-box" id="c-1">1</span>
                <span class="count-box" id="c-2">2</span>
                <span class="count-box" id="c-3">3</span>
                <span class="count-box" id="c-4">4</span>
            </div>
        </section>

        <!-- Área de Trabajo de Ejercicios (Slots y Banco de Fichas) -->
        <section id="exercise-section" class="hidden">
            <div class="instruction-box">
                <p id="exercise-instruction">Arrastrá o seleccioná las figuras para completar los 4 pulsos del patrón escuchado:</p>
            </div>

            <!-- Slots de Pulsos (Destino) -->
            <div id="slots-container">
                <div class="pulse-slot" data-index="0">
                    <div class="slot-number">Pulso 1</div>
                    <div class="slot-dropzone" data-slot="0"></div>
                </div>
                <div class="pulse-slot" data-index="1">
                    <div class="slot-number">Pulso 2</div>
                    <div class="slot-dropzone" data-slot="1"></div>
                </div>
                <div class="pulse-slot" data-index="2">
                    <div class="slot-number">Pulso 3</div>
                    <div class="slot-dropzone" data-slot="2"></div>
                </div>
                <div class="pulse-slot" data-index="3">
                    <div class="slot-number">Pulso 4</div>
                    <div class="slot-dropzone" data-slot="3"></div>
                </div>
            </div>

            <!-- Banco de Fichas Disponibles -->
            <div class="bank-title">Fichas disponibles:</div>
            <div id="tokens-bank">
                <!-- Se poblarán dinámicamente según la etapa activa -->
            </div>

            <div class="validation-panel">
                <button id="btn-check" class="btn success" disabled>✔️ Comprobar Respuestas</button>
                <div id="feedback-message" class="hidden"></div>
                <button id="btn-next-exercise" class="btn primary hidden">Siguiente Ejercicio ➡️</button>
            </div>
        </section>

        <!-- Pantalla de Tutoriales / Explicaciones -->
        <section id="tutorial-section" class="hidden">
            <div id="tutorial-content"></div>
            <button id="btn-finish-tutorial" class="btn primary">¡Entendido, quiero practicar! 🚀</button>
        </section>

        <!-- Pantalla de Resultados Finales (Etapa 6) -->
        <section id="results-section" class="hidden">
            <h2>🎉 ¡Felicitaciones! Completaste el recorrido</h2>
            <div id="stats-container">
                <p>Ejercicios resueltos: <span id="stat-total">0</span></p>
                <p>Aciertos: <span id="stat-correct">0</span></p>
                <p>Porcentaje de aciertos: <span id="stat-percent">0</span>%</p>
            </div>
            <div id="recommendations-box"></div>
            <button id="btn-restart" class="btn primary">Reiniciar Actividad</button>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
